<!doctype html>
<!-- Template for public/og.png (the link-preview image). Regenerate with `npm run og`. -->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face { font-family: "Instrument Serif"; src: url("../../node_modules/@fontsource/instrument-serif/files/instrument-serif-latin-400-normal.woff2"); }
      @font-face { font-family: "Instrument Serif"; font-style: italic; src: url("../../node_modules/@fontsource/instrument-serif/files/instrument-serif-latin-400-italic.woff2"); }
      @font-face { font-family: "Geist Mono"; src: url("../../node_modules/@fontsource-variable/geist-mono/files/geist-mono-latin-wght-normal.woff2"); font-weight: 100 900; }
      * { margin: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      body {
        background: #0e0f0d;
        color: #ecebe4;
        padding: 64px 80px 60px;
        display: flex;
        flex-direction: column;
        -webkit-font-smoothing: antialiased;
      }
      .mono { font-family: "Geist Mono", monospace; font-size: 20px; letter-spacing: 0.14em; text-transform: uppercase; color: #908f87; }
      .top { display: flex; justify-content: space-between; padding-bottom: 22px; border-bottom: 1px solid #262722; }
      .now { display: flex; align-items: center; gap: 12px; }
      .dot { width: 10px; height: 10px; border-radius: 50%; background: #5fcf94; }
      .intro { margin: auto 0; }
      h1 { font-family: "Instrument Serif", serif; font-weight: 400; font-size: 150px; line-height: 0.95; letter-spacing: -0.02em; }
      h1 em { color: #908f87; }
      .role { margin-top: 26px; }
      .role b { color: #5fcf94; font-weight: 400; }
      .bars { display: flex; gap: 4px; height: 40px; }
      .bars span { flex: 1; background: #5fcf94; opacity: 0.8; border-radius: 1px; }
      .bars span.warn { background: #e0a84a; opacity: 0.9; }
    </style>
  </head>
  <body>
    <div class="top mono">
      <span>billycummings.com</span>
      <span class="now"><span class="dot"></span>Currently at i3 Broadband</span>
    </div>
    <div class="intro">
      <h1>Bill <em>Cummings</em></h1>
      <p class="role mono">Network Operations Analyst <b>/</b> Reporting &amp; Analysis</p>
    </div>
    <div class="bars" id="bars"></div>
    <script>
      const bars = document.getElementById("bars");
      for (let i = 0; i < 64; i++) {
        const s = document.createElement("span");
        if (i === 20 || i === 45) s.className = "warn";
        bars.append(s);
      }
    </script>
  </body>
</html>
