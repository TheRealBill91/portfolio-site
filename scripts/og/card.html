<!doctype html>
<!-- Template for public/og.png (the link-preview image). Regenerate with `npm run og`. -->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "Inter";
        src: url("../../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2") format("woff2");
        font-weight: 100 900;
      }
      * { margin: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      body {
        font-family: "Inter", sans-serif;
        font-feature-settings: "cv11", "ss01";
        -webkit-font-smoothing: antialiased;
        background:
          radial-gradient(900px 520px at 100% 0%, rgba(138, 167, 255, 0.16), transparent 60%),
          radial-gradient(700px 420px at 0% 100%, rgba(138, 167, 255, 0.06), transparent 60%),
          #0c0c0e;
        color: #ececee;
        padding: 80px 88px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      /* Faint grid texture, masked so it fades out toward the bottom-left. */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image:
          linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
        background-size: 48px 48px;
        mask-image: radial-gradient(800px 500px at 100% 0%, black, transparent 75%);
      }
      .mark {
        width: 64px; height: 64px; border-radius: 16px;
        background: #ececee; color: #0c0c0e;
        display: grid; place-items: center;
        font-weight: 650; font-size: 26px; letter-spacing: -0.02em;
      }
      h1 { font-size: 92px; font-weight: 650; letter-spacing: -0.035em; line-height: 1; }
      .role { margin-top: 26px; font-size: 36px; color: #9a9aa3; letter-spacing: -0.01em; }
      .footer { display: flex; align-items: center; justify-content: space-between; font-size: 26px; color: #9a9aa3; }
      .now { display: flex; align-items: center; gap: 14px; }
      .dot { width: 12px; height: 12px; border-radius: 50%; background: #10b981; box-shadow: 0 0 0 6px rgba(16,185,129,0.15); }
      .rule { height: 1px; background: #232327; margin-bottom: 36px; }
    </style>
  </head>
  <body>
    <div class="mark">BC</div>
    <div>
      <h1>Bill Cummings</h1>
      <p class="role">Network Operations Analyst — Reporting &amp; Analysis</p>
    </div>
    <div>
      <div class="rule"></div>
      <div class="footer">
        <span>billycummings.com</span>
        <span class="now"><span class="dot"></span>Currently at i3 Broadband</span>
      </div>
    </div>
  </body>
</html>
